<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Kaviya! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6fb7;
    --gold: #ffd700;
    --purple: #c471ed;
    --bg: #0d001a;
    --light: #fff0f8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
    position: relative;
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to   { opacity: 1;   transform: scale(1.2); }
  }

  /* Balloons */
  .balloons {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .balloon {
    position: absolute;
    bottom: -120px;
    font-size: 3rem;
    animation: floatUp var(--dur, 8s) ease-in infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-5deg); opacity: 1; }
    50%  { transform: translateY(-50vh) rotate(5deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(-5deg); opacity: 0; }
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 14px;
    top: -20px;
    animation: confettiFall var(--cf-d, 4s) linear infinite;
    border-radius: 2px;
    opacity: 0.85;
    z-index: 0;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 3.5rem 3rem 3rem;
    border-radius: 2.5rem;
    background: linear-gradient(135deg, rgba(255,111,183,0.13), rgba(196,113,237,0.13));
    border: 2px solid rgba(255,111,183,0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 60px rgba(255,111,183,0.25), 0 0 120px rgba(196,113,237,0.15);
    max-width: 520px;
    width: 90vw;
    animation: cardPop 0.8s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes cardPop {
    from { transform: scale(0.5) translateY(60px); opacity: 0; }
    to   { transform: scale(1) translateY(0);      opacity: 1; }
  }

  .emoji-top {
    font-size: 3.5rem;
    display: block;
    margin-bottom: 0.5rem;
    animation: bounce 1.2s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to   { transform: translateY(-12px) rotate(5deg); }
  }

  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    background: linear-gradient(90deg, var(--pink), var(--gold), var(--purple), var(--pink));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    line-height: 1.15;
    margin-bottom: 0.2rem;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 10vw, 5rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(255,215,0,0.3);
    letter-spacing: 0.05em;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 20px rgba(255,215,0,0.5); }
    to   { text-shadow: 0 0 40px rgba(255,215,0,0.9), 0 0 80px rgba(255,215,0,0.4); }
  }

  .emoji-row {
    font-size: 2rem;
    margin: 1.2rem 0;
    letter-spacing: 0.2em;
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .emoji-row span {
    display: inline-block;
    animation: pop 0.5s ease both;
  }
  .emoji-row span:nth-child(1)  { animation-delay: 0.8s; }
  .emoji-row span:nth-child(2)  { animation-delay: 1.0s; }
  .emoji-row span:nth-child(3)  { animation-delay: 1.2s; }
  .emoji-row span:nth-child(4)  { animation-delay: 1.4s; }
  .emoji-row span:nth-child(5)  { animation-delay: 1.6s; }
  .emoji-row span:nth-child(6)  { animation-delay: 1.8s; }
  .emoji-row span:nth-child(7)  { animation-delay: 2.0s; }
  @keyframes pop {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }

  .wish {
    color: var(--light);
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    margin-top: 1rem;
    opacity: 0.85;
    line-height: 1.7;
    animation: fadeIn 1s 2.2s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 0.85; transform: translateY(0); }
  }

  .heart-beat {
    display: inline-block;
    animation: heartbeat 1s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%     { transform: scale(1.3); }
    28%     { transform: scale(1); }
    42%     { transform: scale(1.3); }
    70%     { transform: scale(1); }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Confetti -->
<div id="confetti"></div>

<!-- Balloons -->
<div class="balloons" id="balloons"></div>

<!-- Card -->
<div class="card">
  <span class="emoji-top">🎂</span>
  <h1>Happy Birthday</h1>
  <div class="name">Kaviya ✨</div>
  <div class="emoji-row">
    <span>🎉</span><span>🎈</span><span>🌸</span><span>💖</span><span>🌟</span><span>🍰</span><span>🎊</span>
  </div>
  <p class="wish">
    Wishing you a day filled with joy, laughter,<br>
    and all the magic you deserve! <span class="heart-beat">💕</span><br>
    May all your dreams come true, Kaviya! 🌈
  </p>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*3+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // Confetti
  const confettiEl = document.getElementById('confetti');
  const colors = ['#ff6fb7','#ffd700','#c471ed','#ff9de2','#a8edea','#f6d365'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --cf-d:${(Math.random()*4+3).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
      width:${Math.random()*8+6}px;
      height:${Math.random()*12+8}px;
      transform:rotate(${Math.random()*360}deg);
    `;
    confettiEl.appendChild(c);
  }

  // Balloons
  const balloonsEl = document.getElementById('balloons');
  const balloonEmojis = ['🎈','🎀','💜','🌸','🎊','💛'];
  function spawnBalloon() {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.textContent = balloonEmojis[Math.floor(Math.random()*balloonEmojis.length)];
    const dur = (Math.random()*5+6).toFixed(1);
    b.style.cssText = `
      left:${Math.random()*95}%;
      font-size:${Math.random()*1.5+2.5}rem;
      --dur:${dur}s;
      animation-delay:0s;
    `;
    balloonsEl.appendChild(b);
    setTimeout(() => b.remove(), dur * 1000);
  }
  setInterval(spawnBalloon, 800);
  for (let i = 0; i < 5; i++) setTimeout(spawnBalloon, i * 300);
</script>
</body>
</html>
